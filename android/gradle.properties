org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The version being worked towards. Raised by hand when a release is cut.
appVersionName=0.1.0

# What a build gets when nobody passes -PappVersionCode. Android refuses to
# install a lower code over a higher one, so this is kept level with whatever
# was last put on a phone rather than reset to 1.
appVersionCode=1

# Where someone with no invitation is sent to set up a group of their own. A
# fork with a setup page of its own passes -PsetupPageUrl=... or changes it
# here.
setupPageUrl=https://geoshare-setup.web.app/
