org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The last version released, raised by hand as the first step of cutting the
# next one (docs/development.md, Releasing); a build between the two says the
# version it grew from.
appVersionName=0.3.0

# What a debug build gets when nobody passes -PappVersionCode. A release does
# not read it: tools/version-code.sh works the code out from appVersionName,
# 0.1.0 being 100, and both release.yml and VARIANT=release tools/build.sh
# pass it on.
appVersionCode=1

# Where someone with no invitation is sent to set up a group of their own. A
# fork with a setup page of its own passes -PsetupPageUrl=... or changes it
# here.
setupPageUrl=https://geoshare-setup.web.app/

# Where the map's tiles come from, in the form the map library takes: an https
# address with {z}, {x} and {y} in it. A fork that serves tiles of its own, or
# is asked to use another server, passes -PtileUrl=... or changes it here. The
# page keeps the same address in web/public/lib/map.js, and a test holds the
# two together.
tileUrl=https://tile.openstreetmap.org/{z}/{x}/{y}.png

# The page a problem report is opened on, without the title and the body,
# which the application adds. -PissuePageUrl=... points a fork at its own.
issuePageUrl=https://github.com/VitalyOstanin/geoshare/issues/new

# The address the update check asks for the project's latest release, in the
# form of GitHub's API. A fork that publishes its own builds passes
# -PlatestReleaseUrl=... or changes it here; left alone, it would be told about
# the original project's releases, signed with another key.
latestReleaseUrl=https://api.github.com/repos/VitalyOstanin/geoshare/releases/latest

# The project's website, ending in /; a Russian-speaking device opens its ru/
# page. -PwebsiteUrl=... points a fork at its own.
websiteUrl=https://vitalyostanin.github.io/geoshare/

# The directory of the satellite orbits files, ending in /; the application
# adds the year, the day and the file's name. -PorbitsUrl=... names a mirror.
orbitsUrl=https://igs.bkg.bund.de/root_ftp/IGS/BRDC/
