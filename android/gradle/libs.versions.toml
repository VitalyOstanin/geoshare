# Library versions. The toolchain versions — SDK, JDK, Gradle — are in
# tools/versions.env instead, because the container image needs them too.
#
# Every version here was taken from the artefact repository at the time it was
# added, not from an example. Check before bumping rather than after.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
# The activity is an AppCompat one for one reason: the language a member picks
# inside the application is applied through AppCompatDelegate, and below
# Android 13 that is the only way the choice reaches the screens at all.
appcompat = "1.8.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
# Not used directly: Play Services pulls in a fragment old enough that the
# activity-result check refuses to build, and this lifts it.
fragment = "1.9.1"
coroutines = "1.11.0"
firebaseBom = "34.19.0"
playServicesLocation = "21.4.0"
# The map background. Takes the same style document the page does and draws
# OpenStreetMap tiles from it, so the application needs no map key and no
# payment method behind one.
maplibre = "13.6.1"
# Loads the account picture into the map screen. Two artefacts: the Compose
# entry point and the network layer it fetches through.
coil = "3.6.3"
# Draws an invitation as a QR code on the administrator's screen. The core
# alone: it encodes and decodes in plain Java, without the camera or
# Android parts of the wider project.
zxing = "3.5.4"
# The camera behind the invitation scanner: a preview to aim with and the
# frames zxing reads the code out of. No Play Services under it, so the
# scanner works on a phone without them like the rest of the application.
camerax = "1.6.2"
# The licences of everything the application carries, listed on a screen of
# its own: the plugin collects them from the dependencies at build time, the
# core library reads what it collected.
aboutLibraries = "15.3.0"
junit = "4.13.2"
# The instrumented smoke tests: the runner on the device and the JUnit 4
# bridge the Compose test rules are built on.
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# Stand-ins for the platform classes the JVM tests cannot build for real:
# a Location or a GnssStatus off the stub jar answers every call with 0.
mockk = "1.14.11"
# The real implementation of the classes org.json.* names, in place of the
# Android stub jar the unit test classpath otherwise resolves them to: that
# one is built with `unitTests.isReturnDefaultValues`, under which every
# method simply answers 0, "" or null rather than parsing anything.
orgJson = "20260814"
# The software bill of materials attached to every release: the libraries the
# release build carries, in a machine-readable list.
cyclonedx = "3.5.1"
ktlintPlugin = "14.2.0"
# The ktlint the plugin runs, rather than whichever one it defaults to: the
# rules change between releases and the check has to fail the same way
# everywhere.
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Awaits a Play Services Task from a coroutine; Firebase returns those.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
mockk = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
# Kotlin support is built into AGP from 9.0 onwards, so there is no
# kotlin-android plugin here; the Kotlin version below is what the Compose
# plugin pins.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
# The Android flavour of the plugin: it writes the list into the resources as
# part of every build, rather than leaving a task to be run by hand.
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
# Writes the bill of materials of the application as CycloneDX JSON, for the
# release on GitHub to carry.
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
