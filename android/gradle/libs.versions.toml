# Library versions. The toolchain versions — SDK, JDK, Gradle — are in
# tools/versions.env instead, because the container image needs them too.
#
# Every version here was taken from the artefact repository at the time it was
# added, not from an example. Check before bumping rather than after.

[versions]
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.0"
# The activity is an AppCompat one for one reason: the language a member picks
# inside the application is applied through AppCompatDelegate, and below
# Android 13 that is the only way the choice reaches the screens at all.
appcompat = "1.8.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
# Not used directly: Play Services pulls in a fragment old enough that the
# activity-result check refuses to build, and this lifts it.
fragment = "1.9.0"
coroutines = "1.11.0"
firebaseBom = "34.19.0"
playServicesLocation = "21.4.0"
# Sign-in: the chooser the system shows, its Play Services backend and the
# Google option that turns the chosen account into an identity token.
credentials = "1.6.0"
googleid = "1.2.0"
# The map background. Takes the same style document the page does and draws
# OpenStreetMap tiles from it, so the application needs no map key and no
# payment method behind one.
maplibre = "13.6.1"
# Loads the account picture into the map screen. Two artefacts: the Compose
# entry point and the network layer it fetches through.
coil = "3.6.2"
junit = "4.13.2"
googleServices = "4.5.0"
ktlintPlugin = "14.2.0"
# The ktlint the plugin runs, rather than whichever one it defaults to: the
# rules change between releases and the check has to fail the same way
# everywhere.
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Awaits a Play Services Task from a coroutine; Firebase returns those.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
# Kotlin support is built into AGP from 9.0 onwards, so there is no
# kotlin-android plugin here; the Kotlin version below is what the Compose
# plugin pins.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Reads google-services.json and turns it into the resources the Firebase
# libraries look up at runtime. Needs that file, which is why it only
# appears alongside it.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
