<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Geoshare</title>
        <!-- The drawing the Android launcher icon is made of. The PNG is for
             the browsers that take no SVG in a tab; the manifest and the
             touch icon are what a shortcut on a home screen is drawn from. -->
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <!-- Served from here rather than from somebody else's server: the
             library's own worker refuses to start when the library is read
             across origins, and the map then draws a background with nothing
             on it. lib/vendor holds the whole of it, version and all. -->
        <link rel="stylesheet" href="lib/vendor/maplibre-gl.css" />
        <link rel="stylesheet" href="styles.css" />

        <!-- The theme has to be on the element before the page is first
             painted, and a module runs after that: a white flash on the way
             into a dark map is the one thing the setting exists to avoid.
             A file rather than a few lines written here, so that the page can
             be served under a policy that allows no inline script at all. -->
        <script src="boot-theme.js"></script>
        <!-- The same for a sign-in this browser remembers: the account comes
             back on its own a moment later, and a sign-in button standing in
             the meantime reads as having been signed out. -->
        <script src="boot-sign-in.js"></script>
    </head>
    <body>
        <section id="sign-in">
            <h1>Geoshare</h1>
            <!-- The words here are the first paint, and lib/words holds them
                 too: a viewer reading in the other language gets those as soon
                 as the modules run. -->
            <p id="sign-in-explanation">Sign in with the Google account the family shares positions under.</p>
            <button id="sign-in-button" type="button">Sign in with Google</button>
            <!-- Shown instead of the two above while a remembered account is
                 coming back; the words arrive with the modules. -->
            <p id="sign-in-waiting">
                <span class="spinner"></span>
                <span id="sign-in-waiting-text"></span>
            </p>
            <p id="sign-in-error" class="error"></p>
        </section>

        <div id="map" hidden></div>

        <!-- Cycles the map between not following, the member whose card was
             looked at last, and everybody at once. Kept at the top left so a
             tap never lands on the account button at the top right or the
             zoom buttons at the bottom right. A round mark per mode, the same
             marks as the Android app; the words of the mode are its label,
             and for a moment after a change they stand beside the mark. A
             press opens the menu below rather than stepping through the modes:
             the menu says what each one does and how to pick a member. -->
        <button id="follow-button" type="button" aria-haspopup="menu" aria-expanded="false" hidden>
            <svg data-mode="none" viewBox="0 0 24 24" aria-hidden="true">
                <path class="stroke" d="M5,12a7,7 0 1,0 14,0a7,7 0 1,0 -14,0 M12,1v4 M12,19v4 M1,12h4 M19,12h4" />
            </svg>
            <svg data-mode="one" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path class="stroke" d="M5,12a7,7 0 1,0 14,0a7,7 0 1,0 -14,0 M12,1v4 M12,19v4 M1,12h4 M19,12h4" />
                <path class="fill" d="M9,12a3,3 0 1,0 6,0a3,3 0 1,0 -6,0 Z" />
            </svg>
            <svg data-mode="all" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path class="stroke" d="M3,8V3h5 M16,3h5v5 M21,16v5h-5 M8,21H3v-5" />
                <path class="fill" d="M7,10a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 Z M13,15a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 Z" />
            </svg>
            <span id="follow-caption"></span>
        </button>

        <div id="follow-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-mode="none" aria-checked="false">
                <span class="follow-item-title"></span>
                <span class="follow-item-note"></span>
            </button>
            <button type="button" role="menuitemradio" data-mode="one" aria-checked="false">
                <span class="follow-item-title"></span>
                <span class="follow-item-note"></span>
            </button>
            <button type="button" role="menuitemradio" data-mode="all" aria-checked="false">
                <span class="follow-item-title"></span>
                <span class="follow-item-note"></span>
            </button>
            <p id="follow-hint"></p>
        </div>

        <!-- The way into everything that is not the map: who is signed in,
             and where to change it. -->
        <div id="account" hidden>
            <button id="account-button" type="button" aria-haspopup="menu" aria-expanded="false">
                <img id="account-picture" alt="" hidden />
                <span id="account-initial"></span>
            </button>

            <div id="account-menu" role="menu" hidden>
                <p id="account-name"></p>

                <p id="theme-label" class="choice-label">Appearance</p>

                <!-- Three buttons rather than a list: the whole choice is
                     three words long, and which one is on now should be
                     readable without opening anything. -->
                <div id="theme-choice" class="choice" role="group" aria-labelledby="theme-label">
                    <button type="button" data-theme="light" aria-pressed="false">Light</button>
                    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
                    <button type="button" data-theme="system" aria-pressed="false">System</button>
                </div>

                <!-- The same three-button row as the theme above it. The two
                     named languages say so in their own words, which is what a
                     viewer looking for theirs reads first. -->
                <p id="language-label" class="choice-label">Language</p>

                <div id="language-choice" class="choice" role="group" aria-labelledby="language-label">
                    <button type="button" data-language="ru" aria-pressed="false">Русский</button>
                    <button type="button" data-language="en" aria-pressed="false">English</button>
                    <button type="button" data-language="system" aria-pressed="false">System</button>
                </div>

                <!-- Who is in the group, and the two ways into one. Offered
                     together because the page cannot tell them apart: a group
                     that has not been made and a group this account is not on
                     both read as no roster at all, since a group document is
                     closed to everybody who is not in it. -->
                <p id="group-label" class="choice-label">Group</p>

                <div id="group">
                    <p id="group-note" hidden></p>
                    <div id="group-members"></div>

                    <div id="group-buttons">
                        <button id="group-found" type="button" hidden></button>
                        <!-- Handing out invitations and taking members off are
                             not settings of this browser, so they are not in
                             this menu: the button opens the panel that holds
                             them, and only the member running the group is
                             offered it. -->
                        <button id="group-admin" type="button" hidden></button>
                        <!-- Every member's own phones, to ring the one lost at
                             home: not only for whoever runs the group. -->
                        <button id="group-phones" type="button" hidden></button>
                    </div>

                    <!-- Nothing here is capitalised for the person typing:
                         half of an invitation is an account id, where an
                         upper case letter and a lower case one belong to two
                         different accounts. -->
                    <div id="group-join" hidden>
                        <input id="group-typed" type="text" autocomplete="off"
                               autocapitalize="none" spellcheck="false" />
                        <button id="group-join-button" type="button"></button>
                    </div>

                    <p id="group-said" hidden></p>
                    <p id="group-error" class="error" hidden></p>
                </div>

                <button id="sign-out-button" type="button" role="menuitem">Sign out</button>
            </div>
        </div>

        <!-- The group seen whole, by the member who runs it. A window of its
             own rather than more of the account menu: what it answers is not
             "how does this browser behave" but "what does the household look
             like from here", and the two questions are asked months apart.

             Kept in the markup rather than built on opening, the way the help
             windows are: the roster behind it changes while it stands, and
             what it shows has to be drawn again when it does. -->
        <!-- This member's phones, each with the siren that finds it. -->
        <dialog id="phones" class="admin">
            <button id="phones-close" class="close-cross" type="button">×</button>
            <h2 id="phones-title"></h2>
            <div id="phones-list"></div>
            <p id="phones-error" class="error" hidden></p>
        </dialog>

        <dialog id="admin" class="admin">
            <button id="admin-close" class="close-cross" type="button">×</button>
            <h2 id="admin-title"></h2>
            <div id="admin-members"></div>
            <!-- Every search standing now, with who opened it, when it ends
                 and the two things to do about it. Below the rows rather
                 than in them: a search is the group's state, not a detail of
                 one member's line. -->
            <div id="admin-searches"></div>

            <div id="admin-invitation" hidden>
                <code id="admin-code"></code>
                <p id="admin-code-lasts"></p>
            </div>

            <div id="admin-buttons">
                <button id="admin-make-invitation" type="button"></button>
                <button id="admin-copy" type="button" hidden></button>
            </div>

            <p id="admin-said" hidden></p>
            <p id="admin-error" class="error" hidden></p>
        </dialog>

        <!-- Opening or renewing a search: what it does, for how long, and
             the end that choice comes to, before anything is written. -->
        <dialog id="search" class="admin naming search">
            <h2 id="search-title"></h2>
            <p id="search-note"></p>
            <div id="search-hours" class="choice" role="group"></div>
            <p id="search-until"></p>
            <p id="search-error" class="error" hidden></p>
            <div id="search-buttons">
                <button id="search-go" type="button" class="alarm"></button>
                <button id="search-cancel" type="button"></button>
            </div>
        </dialog>

        <!-- Ringing a phone: which of the member's phones, and what the
             twenty seconds will do, before anything is written. -->
        <dialog id="siren" class="admin naming search">
            <h2 id="siren-title"></h2>
            <div id="siren-phones" class="choice" role="group"></div>
            <p id="siren-note"></p>
            <p id="siren-error" class="error" hidden></p>
            <div id="siren-buttons">
                <button id="siren-go" type="button" class="alarm"></button>
                <button id="siren-cancel" type="button"></button>
            </div>
        </dialog>

        <!-- A write that cannot be taken back from the panel, asked about in
             the page's own words first rather than in the browser's window. -->
        <dialog id="confirm" class="admin naming search">
            <h2 id="confirm-title"></h2>
            <p id="confirm-note"></p>
            <div id="confirm-buttons">
                <button id="confirm-go" type="button" class="alarm"></button>
                <button id="confirm-cancel" type="button"></button>
            </div>
        </dialog>

        <!-- Told to the member being looked for, over the map: their place is
             open to the whole group, and they can say they are found. -->
        <div id="sought-banner" class="sought-banner" role="alert" hidden>
            <b id="sought-text"></b>
            <span id="sought-note"></span>
            <button id="sought-found" type="button" class="alarm-fill"></button>
        </div>

        <!-- A name for a phone or a person, seen by this viewer alone. The
             buttons are not a form's: the dialog is closed by the page once
             the name is on its way, and a submit would reload nothing here. -->
        <dialog id="naming" class="admin naming">
            <h2 id="naming-title"></h2>
            <p id="naming-note"></p>
            <input id="naming-typed" type="text" maxlength="40" autocomplete="off">
            <div id="naming-buttons">
                <button id="naming-save" type="button"></button>
                <button id="naming-reset" type="button"></button>
                <button id="naming-cancel" type="button"></button>
            </div>
        </dialog>

        <section id="panel" hidden>
            <!-- The card belongs to the strip below it rather than to a
                 marker on the map, so it lives here, drawn over the top of
                 the panel rather than pinned to whatever pin it is about. -->
            <div id="card" hidden></div>
            <!-- One line for everything the strip cannot say by being full:
                 an answer still on its way, a group where nobody shares yet,
                 a position the group refuses us, a connection that is gone. -->
            <p id="panel-note" hidden></p>
            <!-- Who else has the map open. Kept apart from the line above,
                 which is about what the strip cannot show; this one is about
                 the household, and both can be true at once. -->
            <p id="panel-watching" hidden></p>
            <!-- Asked for by "follow a member" with nobody to follow: the
                 strip right under it is where the answer is given. -->
            <p id="follow-wait" hidden></p>
            <div id="members"></div>
        </section>

        <script type="module" src="app.js"></script>
    </body>
</html>
