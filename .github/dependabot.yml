# Dependabot opens one weekly pull request per ecosystem, with every bump of
# that ecosystem grouped into it. The toolchain pins in tools/versions.env
# (SDK, build tools, JDK, Node, ESLint, firebase-tools) sit outside every
# ecosystem and are refreshed by hand. GRADLE_VERSION and GRADLE_SHA256 there
# repeat the wrapper's distribution: a pull request that bumps the wrapper
# changes them in the same commit, or the SDK image keeps the old Gradle.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns:
          - "*"
    # Firestore 27 from firebase-bom 35 declares junit as a runtime
    # dependency, which puts an EPL-1.0 library into the APK
    # (firebase/firebase-android-sdk#8696). Lift once that is fixed.
    ignore:
      - dependency-name: "com.google.firebase:firebase-bom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/firebase/tests"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
