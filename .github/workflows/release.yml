name: Release

# A v-tag builds the shrunk release package, signs it with the release key
# (ADR-0034) and publishes it with its checksum and its section of
# CHANGELOG.md on the releases page. A dispatched run builds and signs without
# publishing: it proves the pipeline before a tag is cut.
#
# The checks of ci.yml run first: a push of a tag starts no other workflow,
# and a tag on a commit whose tests fail would otherwise be signed and
# published like any other.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The key lives in this environment's secrets, and the environment asks
    # the project owner to approve every run that reaches them.
    environment: release
    permissions:
      contents: write
      # The attestations below: a token to ask Sigstore for a signing
      # certificate, and the right to store what it signed.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token of this job may write the repository; the build that
          # follows runs plugin and dependency code, which has no use for it.
          # Publishing goes through the release action's API call instead.
          persist-credentials: false

      - name: Read the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: The tag names the version being built
        # A release published under a name the package does not carry is a
        # release nobody finds. A dispatched run has no tag to compare.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^appVersionName=//p' android/gradle.properties)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::the tag ${GITHUB_REF_NAME} differs from appVersionName ${version}"
            exit 1
          fi

      - name: The tag is annotated
        # An annotated tag carries who cut the release, when, and why; a
        # lightweight one is only a name, and is easy to push by mistake.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.type)
          if [[ "${type}" != tag ]]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; cut it with git tag -a"
            exit 1
          fi

      - name: The commit is on master
        # A tag can be put on any commit, a branch nobody reviewed among them;
        # only what master holds is published.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)
          if [[ "${status}" != identical && "${status}" != behind ]]; then
            echo "::error::${GITHUB_SHA} is not on master (${status})"
            exit 1
          fi

      - name: The release notes
        # Before the build, so that unfinished notes stop the run in seconds.
        if: startsWith(github.ref, 'refs/tags/')
        run: tools/release-notes.sh "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/notes.md"

      - name: The version code, from the version
        # Android refuses to install a lower code over a higher one, so the
        # code is worked out from the version rather than raised by hand:
        # 0.1.0 is 100, 1.2.3 is 10203. Each part past the first stays below
        # a hundred for that to hold.
        run: |
          version=$(sed -n 's/^appVersionName=//p' android/gradle.properties)
          if ! [[ "${version}" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::appVersionName ${version} is not major.minor.patch with minor and patch below 100"
            exit 1
          fi
          # Base ten throughout: a part written "08" is not read as octal.
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "APP_VERSION_NAME=${version}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${code}" >> "$GITHUB_ENV"

      - name: Setup Java and the Android SDK
        uses: ./.github/actions/android-setup

      - name: Put apksigner on the path
        run: echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A release is built from what the repository says, not from a cache
          # a pull request could have shaped.
          cache-disabled: true

      - name: Build the release package
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PappVersionCode="${APP_VERSION_CODE}"

      - name: Sign it
        # tools/sign-release.sh refuses a key whose fingerprints differ from
        # android/release-fingerprints.txt.
        env:
          GEOSHARE_RELEASE_KEYSTORE_BASE64: ${{ secrets.GEOSHARE_RELEASE_KEYSTORE_BASE64 }}
          GEOSHARE_RELEASE_ALIAS: ${{ secrets.GEOSHARE_RELEASE_ALIAS }}
          GEOSHARE_RELEASE_PASSWORD: ${{ secrets.GEOSHARE_RELEASE_PASSWORD }}
        run: |
          export GEOSHARE_RELEASE_KEYSTORE="${RUNNER_TEMP}/release.jks"
          # Taken away however the signing ends: a refused key or a failed
          # apksigner stops the step before any line after it.
          trap 'rm -f "${GEOSHARE_RELEASE_KEYSTORE}"' EXIT
          umask 077
          base64 --decode <<< "${GEOSHARE_RELEASE_KEYSTORE_BASE64}" > "${GEOSHARE_RELEASE_KEYSTORE}"
          tools/sign-release.sh

      - name: The package says what it should
        # Read off the signed file itself: the application, the version and
        # its code a device will see.
        run: |
          # The whole output first: cut short by head, aapt2 could die of a
          # closed pipe, and the step runs with pipefail.
          badging=$(aapt2 dump badging build/geoshare-*.apk)
          badging="${badging%%$'\n'*}"
          echo "${badging}"
          expected="package: name='io.github.vitalyostanin.geoshare' versionCode='${APP_VERSION_CODE}' versionName='${APP_VERSION_NAME}'"
          if [[ "${badging}" != "${expected}"* ]]; then
            echo "::error::expected ${expected}"
            exit 1
          fi

      - name: List what the package is built from
        # The bill of materials: the libraries the release build carries, as
        # CycloneDX JSON, published beside the package. Only the release
        # runtime classpath goes in, so no test library is listed.
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:cyclonedxDirectBom
          cp app/build/reports/cyclonedx-direct/bom.json "../build/geoshare-${APP_VERSION_NAME}.cdx.json"

      - name: Sum what was built
        run: |
          cd build
          sha256sum ./geoshare-*.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Attest where the package was built
        # Binds the package's digest to this repository, commit and run;
        # gh attestation verify checks it. Only for a published release: the
        # attestation is public, and a dispatched run publishes nothing. GitHub
        # attests only for public repositories on the free plan, so a release
        # cut while the repository is private goes without.
        if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/geoshare-*.apk

      - name: Attest what the package was built from
        # Binds the bill of materials to the package's digest, so that the
        # attached file can be checked to be the one built with it.
        if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/geoshare-*.apk
          sbom-path: build/geoshare-${{ env.APP_VERSION_NAME }}.cdx.json

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            build/geoshare-*.apk
            build/geoshare-*.cdx.json
            build/SHA256SUMS
          fail_on_unmatched_files: true
