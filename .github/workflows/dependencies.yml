name: Dependencies

# Two looks at the dependencies, neither of which builds the app.
#
# The Gradle graph goes to GitHub, which matches it against its advisory
# database and raises Dependabot alerts: the npm lockfiles reach the graph by
# themselves, but Gradle does not, and OSV-Scanner reads no version catalog,
# so without this job the Firebase, MapLibre, Coil, ZXing and CameraX
# artifacts, and everything they pull in, are never checked.
#
# OSV-Scanner reads the npm lockfiles, transitive packages included, against
# the OSV database and reports to the code scanning page. New advisories
# appear without any change of ours, hence the weekly run.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'web/package-lock.json'
      - 'firebase/tests/package-lock.json'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves every configuration of the Android project and submits the result.
  # Not on pull requests: the submission needs write access, which a pull
  # request from a fork does not get.
  gradle-graph:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup the Android SDK
        # The Android plugin needs the platform to configure the project at all.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android
          cache-read-only: true

  # On a pull request only the vulnerabilities it introduces are reported; on
  # master and on the schedule, all of them.
  osv-scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=web/package-lock.json
        --lockfile=firebase/tests/package-lock.json

  osv-scan:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=web/package-lock.json
        --lockfile=firebase/tests/package-lock.json
