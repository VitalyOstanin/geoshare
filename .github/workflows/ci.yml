name: Checks

# The checks tools/check.sh --all runs locally, without the containers: a
# runner already is a throwaway machine, and building the SDK image there on
# every run would cost several minutes before the first test.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # The release runs the same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# A second push to the same branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Kotlin half: formatting, the Android lint and the unit tests.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        # The same file the images and Gradle read. Only the assignments:
        # comments and blank lines are not valid in GITHUB_ENV.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests read the cache the master branch wrote, never write
          # one of their own.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Formatting, lint and unit tests
        working-directory: android
        run: ./gradlew --no-daemon ktlintCheck lintDebug testDebugUnitTest

      - name: Keep the reports of a failed run
        # Only on failure, and kept for three days: storage is counted against
        # the account's allowance while the repository is private.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The page and the rules: the page's own tests, the linter of the
  # JavaScript half, and the rules against the Firestore emulator.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      - name: Setup Java for the emulator
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.FIREBASE_JRE_VERSION }}

      - name: The page's tests
        working-directory: web
        run: npm test

      - name: Lint the JavaScript
        run: npx --yes "eslint@${ESLINT_VERSION}" web firebase

      - name: The rules against the emulator
        # A project id starting with "demo-" keeps the emulator and the client
        # library away from the real service; no credentials are involved.
        run: |
          npm --prefix firebase/tests ci
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --only firestore --project demo-geoshare \
            "npm --prefix firebase/tests test"
