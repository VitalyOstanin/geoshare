name: Checks

# The checks tools/check.sh --all runs locally, and the coverage floors
# tools/coverage.sh keeps, without the containers: a runner already is a
# throwaway machine, and building the SDK image there on every run would cost
# several minutes before the first test.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # The release runs the same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# A second push to the same branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Kotlin half: formatting, the Android lint and the unit tests.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Writing an id-token is what the Codecov upload below proves itself
    # with, in place of a long-lived secret; a job's own block resets the
    # rest to none, so reading the contents is said again.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        # The same file the images and Gradle read. Only the assignments:
        # comments and blank lines are not valid in GITHUB_ENV.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests read the cache the master branch wrote, never write
          # one of their own.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Formatting, lint and unit tests
        # The unit tests run with the coverage agent, so that the floor below
        # reads the report of this very run.
        working-directory: android
        run: ./gradlew --no-daemon -Pcoverage ktlintCheck detekt lintDebug createDebugUnitTestCoverageReport

      - name: Coverage floor
        run: tools/coverage-floor.sh

      - name: Send the coverage to Codecov
        # The master branch only, the one the badge shows; an outage on their
        # side is no reason to fail the checks.
        if: github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: android/app/build/reports/coverage/test/debug/report.xml
          flags: android
          fail_ci_if_error: false

      - name: Keep the reports of a failed run
        # Only on failure, and kept for three days: storage is counted against
        # the account's allowance while the repository is private.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The page and the rules: the page's own tests, the linters of the
  # JavaScript half and of the documents, and the rules against the Firestore
  # emulator.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Writing an id-token is what the Codecov upload below proves itself
    # with, in place of a long-lived secret; a job's own block resets the
    # rest to none, so reading the contents is said again.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      - name: Setup Java for the emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.FIREBASE_JRE_VERSION }}

      - name: No known vulnerability in the npm packages
        # Read off the lock files alone. A package Firebase pulls in can stay
        # vulnerable for months after the fix: it is then raised through
        # "overrides" in package.json, and this step is what notices the next
        # one.
        run: |
          npm --prefix web audit --audit-level=high
          npm --prefix firebase/tests audit --audit-level=high

      - name: The page's tests and their coverage floors
        working-directory: web
        run: npm run coverage

      - name: Send the coverage to Codecov
        # The master branch only, the one the badge shows; an outage on their
        # side is no reason to fail the checks.
        if: github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: web/build/lcov.info
          flags: web
          fail_ci_if_error: false

      - name: Lint the JavaScript
        run: npx --yes -p "eslint@${ESLINT_VERSION}" -p "@eslint/js@${ESLINT_JS_VERSION}" eslint web firebase

      - name: Lint the Markdown
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"

      - name: The release notes hold their own section only
        # What release.yml publishes for each dated version of CHANGELOG.md:
        # the link definitions at the end of the file are not part of it.
        run: |
          sed -n 's/^## \[\([0-9][^]]*\)\] - .*/\1/p' CHANGELOG.md |
            while read -r version; do
              if tools/release-notes.sh "${version}" | grep -E '^\[[^]]+\]: '; then
                echo "::error::the notes of ${version} carry the link definitions above"
                exit 1
              fi
            done

      - name: Check the shell scripts
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            "koalaman/shellcheck:v${SHELLCHECK_VERSION}@${SHELLCHECK_DIGEST}" -x

      - name: The rules against the emulator
        # A project id starting with "demo-" keeps the emulator and the client
        # library away from the real service; no credentials are involved.
        run: |
          npm --prefix firebase/tests ci
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --only firestore --project demo-geoshare \
            "npm --prefix firebase/tests test"
